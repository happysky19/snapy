# Topic index data (Appendix F, written by tools/gen_topic_index.py before every render).
#
# `sections` maps every labelled `##` section of the book to the words a reader would look it up by. Each item
# is a term, or a one-key map `term: [aliases]`. A term that several sections share becomes one index line with
# a reference to each; "term, qualifier" sorts under the term. An alias prints as "alias, see term".
# Use the reader's words (the newcomer question bank), not code symbols; a key or symbol may be an alias.
# A chapter or appendix with no `##` sections of its own (the test index) may be listed under its `#` label.
#
# `unlabeled` lists the `##` headings that carry no label, so cannot be indexed, with the label that covers
# them. `.unlisted` part dividers need no row. tools/tests/test_topic_index.py fails when a section has no
# item, when a label here does not exist in the book, or when an unlabeled heading is not listed.

