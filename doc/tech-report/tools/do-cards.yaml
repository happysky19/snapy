  - {"id": "ch11-custom", "chapter": "11-boundaries", "anchor": "sec-ch11-custom", "deck": "examples/straka_single.yaml", "class": "CPU-seconds", "trim": {}, "time": {"source": "estimated", "basis": "four-cell CPU RK1 callback: one measured N8 run, 1.613 s; not the three-repetition timing batch"}, "expect": "exit 0", "run": {"kind": "python", "env": {}, "check": "assert {c[2] for c in calls} >= {snapy.kPrimitive, snapy.kConserved}\nassert all(c[3] == shape and c[4] == torch.float64 and c[5] == \"cpu\" for c in calls)\n# Direct callback checks include a narrowed, non-contiguous tangential view.\nfor dtype in (torch.float32, torch.float64):\n    base = torch.arange(5 * 6 * 8, dtype=dtype).reshape(5, 1, 6, 8)\n    var = base[:, :, 1:3, :]\n    before = var.clone()\n    pointer = var.data_ptr()\n    op = snapy.BoundaryFuncOptions().nghost(2)\n    for face in (0, 1):\n        assert zero_gradient(face)(var, 3, op) is None\n    check_ghosts(var)\n    torch.testing.assert_close(var[..., 2:6], before[..., 2:6], rtol=0, atol=0)\n    once = var.clone()\n    for face in (0, 1):\n        zero_gradient(face)(var, 3, op)\n    torch.testing.assert_close(var, once, rtol=0, atol=0)\n    assert var.data_ptr() == pointer and var.dtype == dtype and var.device.type == \"cpu\"\nprint(\"N8 run.check: float32/float64 CPU ghosts, interior, aliasing, idempotence and slab checks passed\")"}}
