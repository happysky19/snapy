# #280 stage 2 (tests only): six cubed-sphere panels in one process on the jupiter_gcm
# shell (examples/jupiter_gcm.yaml:59-60), dry ideal gas, closed reflecting x1 walls.
# test_stage2_cubed_stretched.py injects the n5 face list and selects each arm.
reference-state: {Tref: 300., Pref: 1.e5}
species:
  - name: dry
    composition: {H: 1.5, He: 0.15}
    cv_R: 2.5
geometry:
  type: gnomonic-equiangle
  bounds: {x1min: 69911000., x1max: 70211000., x2min_pi: -0.25, x2max_pi: 0.25, x3min_pi: -0.25, x3max_pi: 0.25}
  cells: {nx1: 30, nx2: 24, nx3: 24, nghost: 3}
distribute:
  layout: cubed-sphere
  nb2: 1
  nb3: 1
  blocks_per_process: 6
  verbose: false
dynamics:
  equation-of-state:
    type: ideal-gas
    density-floor: 1.e-20
    pressure-floor: 1.e-20
    limiter: false
  reconstruct:
    vertical:   {type: weno5, scale: true, shock: false}
    horizontal: {type: weno5, scale: true, shock: false}
  riemann-solver: {type: lmars}
boundary-condition:
  external:
    x1-inner: reflecting
    x1-outer: reflecting
    x2-inner: custom
    x2-outer: custom
    x3-inner: custom
    x3-outer: custom
integration:
  type: rk3
  cfl: 0.45
  implicit-scheme: 0
  nlim: 100
  tlim: 1.e12
  ncycle_out: 0
forcing:
  const-gravity: {grav1: -22.}
